- id: bbva-11
  tipo: descriptiva
  empresa: [BBVA]
  pregunta: "¿Qué riesgos de tipos de interés menciona BBVA?"
  respuesta_esperada: "BBVA distingue dos ámbitos. En el banking book, el riesgo de interés estructural (IRRBB o RIE): el impacto de las variaciones de tipos en los resultados (vía margen de intereses y valoración a valor razonable) y en el valor patrimonial, con cuatro fuentes: repreciación, curva, opcionalidad y base; además, el riesgo de spread de crédito del banking book (CSRBB). En las carteras de negociación (trading book), el riesgo de tipos de interés como parte del riesgo de mercado, por la exposición a movimientos de las curvas de tipos."
  claves: ["repreciación", "spread de crédito | CSRBB"]
  paginas: [548, 549, 556]
  cita_literal: "El riesgo de interés estructural (en adelante, RIE o IRRBB) recoge el impacto potencial que las variaciones en el tipo de interés de mercado pueden provocar en los resultados [...] se consideran todas las fuentes principales de generación de este riesgo: el riesgo de repreciación, el riesgo de curva, el riesgo de opcionalidad y el riesgo de base. / Adicionalmente, el riesgo de spread de crédito del banking book (CSRBB)... / 7.4.1 Riesgo de mercado en carteras de negociación: Riesgo de tipos de interés..."
  estado: corregida
  notas: "Corregida por Santi: faltaba el marco IRRBB (final p.548), el CSRBB (inicio p.549) y la distinción banking book / trading book (p.556). La idea cruza dos páginas: mide la limitación de trocear dentro de cada página."

