- id: bbva-11
  automatico: false
  pregunta: "¿Qué riesgos de tipos de interés menciona BBVA?"
  esperada: "BBVA distingue dos ámbitos. En el banking book, el riesgo de interés estructural (IRRBB o RIE): el impacto de las variaciones de tipos en los resultados (vía margen de intereses y valoración a valor razonable) y en el valor patrimonial, con cuatro fuentes: repreciación, curva, opcionalidad y base; además, el riesgo de spread de crédito del banking book (CSRBB). En las carteras de negociación (trading book), el riesgo de tipos de interés como parte del riesgo de mercado, por la exposición a movimientos de las curvas de tipos."
  respuesta: "- **Riesgo básico de tipo de interés**: originado por la diferencia entre los plazos de revisión de tipos de interés o vencimiento de las operaciones de inversión respecto a sus financiaciones[1].  \n- **Exposición a cambios en la pendiente y forma de la curva de tipos**[1].  \n- **Indexación a diferentes curvas**[1].  \n- **Riesgo de opcionalidad** presente en determinadas operaciones bancarias[1].  \n- **Riesgo de tipos de interés en carteras de negociación**: exposición al movimiento de las distintas curvas de tipos de interés en las que opera el Grupo, afectando a productos del mercado monetario (depósitos, futuros, call‑money swaps, etc.) y a derivados tradicionales de tipos de interés (swaps, caps, floors, swaptions, etc.) y, en general, a la valoración de cualquier producto financiero por el efecto del descuento financiero[4]."
  fuentes: ["BBVA p.549", "BBVA p.556"]
  acierto: false
  motivo: "[Propuesta de Claude] Incompleta: enumera repreciación, curva, opcionalidad y base, pero omite el marco IRRBB y el CSRBB (idea partida entre p.548 y p.549)."

- id: tef-02
  automatico: false
  pregunta: "¿Por qué varió tanto la plantilla de Telefónica entre 2024 y 2025?"
  esperada: "Bajó de 100.870 (2024) a 82.655 (2025), principalmente por cambios en el perímetro de consolidación: la venta de Telefónica Móviles Argentina, Telefónica del Perú, Telefónica Móviles del Uruguay y Otecel (salida de Hispanoamérica)."
  respuesta: "La plantilla de Telefónica experimentó una reducción importante entre 2024 y 2025 porque :\n\n* La plantilla promedio disminuyó un 13,6 % interanual, pasando a 87 607 empleados en 2025 [1].  \n* En el desglose por países, el número de empleados en Brasil cayó de 36 200 a 34 905, mientras que en España aumentó ligeramente de 25 086 a 25 516 [2].  \n* Los gastos de personal crecieron de 4 852 millones de euros en 2024 a 7 548 millones de euros en 2025, impulsados por los mayores gastos de reestructuración y el registro del plan de reestructuración de 2025 (2 757 millones de euros) [1].  \n\nEstos factores –la reestructuración interna y el ajuste de la plantilla promedio– explican la variación significativa de la plantilla entre ambos años."
  fuentes: ["Telefónica p.18", "Telefónica p.128"]
  acierto: false
  motivo: "[Propuesta de Claude] No responde al porqué: dice que la plantilla bajó, pero no menciona el cambio de perímetro (venta de filiales de Hispanoamérica)."

