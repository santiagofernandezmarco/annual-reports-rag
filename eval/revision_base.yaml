  motivo: "[Propuesta de Claude] Acierta que BBVA es la mayor, pero las cifras de Ferrovial (11.862) y Telefónica (87.607, plantilla media) son incorrectas."

- id: comp-02
  automatico: null
  pregunta: "Compara cómo gestionan el riesgo de tipos de interés las tres empresas."
  esperada: "BBVA: marco IRRBB (repreciación, curva, opcionalidad, base) y sensibilidad positiva a subidas de tipos en el margen. Telefónica: actuaciones globales, fundamentalmente con derivados. Ferrovial: optimizar gasto financiero y equilibrar deuda fija/variable."
  respuesta: "**BBVA**  \n- El riesgo de tipo de interés estructural (RIE o IRRBB) se gestiona dentro del modelo de tres líneas de defensa. La primera línea (Finanzas) es responsable de la gestión del riesgo estructural; la segunda línea (GRM y unidades de Control Interno) identifica el riesgo, define políticas y evalúa la eficacia de los controles; la tercera línea (Auditoría Interna) revisa los controles y procesos específicos [2].\n\n**Ferrovial**  \n- En la tabla de riesgos se señala que las variaciones en variables financieras como los tipos de interés forman parte de los “Risk Events” y que su impacto potencial se controla mediante “policies Analysis and active management” (análisis de políticas y gestión activa) [3].  \n- Además, la estructura de gobierno muestra una supervisión “bottom‑up” con comités de auditoría y control y una separación entre primera, segunda y tercera línea de defensa [4].\n\n**Telefónica**  \n- Para los riesgos financieros, entre ellos el riesgo de tipo de cambio o de interés, la empresa indica que se gestionan mediante “actuaciones globales, fundamentalmente con derivados financieros” [5].\n\n**Comparación**  \n- Las tres compañías utilizan un modelo de tres líneas de defensa, pero describen diferentes mecanismos operativos: BBVA enfatiza la responsabilidad de la primera línea (Finanzas) y la revisión de controles por la segunda y tercera línea; Ferrovial menciona específicamente el análisis de políticas y la gestión activa como medidas de control; Telefónica recurre a instrumentos financieros derivados como principal herramienta de mitigación."
  fuentes: ["BBVA p.548", "Ferrovial p.203", "Ferrovial p.200", "Telefónica p.216"]
  acierto: true
  motivo: "Cubre las tres empresas con citas válidas. Matiz: la conclusión generaliza las tres líneas de defensa a Telefónica sin fuente."

