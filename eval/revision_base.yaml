  esperada: "BBVA (127.174), seguida de Telefónica (82.655) y Ferrovial (22.609)."
  respuesta: "- **BBVA**: 127 174 empleados (61 749 hombres + 65 425 mujeres) en 2025[2]  \n- **Ferrovial**: 11 862 empleados (7 478 hombres + 4 384 mujeres) en 2025[4]  \n- **Telefónica**: 87 607 empleados (plantilla promedio) en 2025[5]\n\n**La empresa con más empleados en 2025 es BBVA.**"
  fuentes: ["BBVA p.693", "Ferrovial p.144", "Telefónica p.18"]
