- id: fer-06
  automatico: null
  pregunta: "¿Cómo gestiona Ferrovial el riesgo de tipo de interés?"
  esperada: "Busca optimizar el gasto financiero y mantener proporciones adecuadas de deuda a tipo fijo y variable según el mercado; cuando los tipos están bajos, intenta fijar importes futuros a nivel de las sociedades ex-proyectos de infraestructura."
  respuesta: "Ferrovial gestiona el riesgo de tipo de interés dentro del marco de su gestión financiera mediante:\n\n* **Identificación del riesgo**: reconoce que las variaciones de variables financieras, entre ellas los tipos de interés, pueden afectar la capacidad de financiación de proyectos y los márgenes netos [1].\n* **Medidas de control**: aplica análisis y gestión activa de las políticas financieras, así como una gestión eficaz de las alternativas financieras disponibles para mitigar la exposición a esas variaciones [1]."
  fuentes: ["Ferrovial p.203"]
  acierto: true
  motivo: "Correcta y con cita válida (p.203), aunque más genérica que la esperada: no menciona el equilibrio deuda fija/variable."

